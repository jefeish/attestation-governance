name: Mock Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  mock-test:
    runs-on: ubuntu-latest
    steps:
      - name: Pretend to run tests
        run: echo "Mock tests passed"

      - name: Save durable check evidence
        if: github.event_name == 'push' && github.repository_visibility == 'public'
        run: |
          mkdir -p build/check-evidence
          cat > build/check-evidence/mock-test.json <<'EOF'
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "check": "mock-test",
            "result": "success"
          }
          EOF

      - name: Attest the check evidence
        if: github.event_name == 'push' && github.repository_visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: build/check-evidence/mock-test.json
          predicate-type: https://example.com/attestation/check-results/v1
          predicate: '{"check":"mock-test","result":"success"}'
