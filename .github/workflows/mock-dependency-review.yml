name: Mock dependency review

on:
  workflow_call:
    inputs:
      source-repository:
        required: true
        type: string
      source-sha:
        required: true
        type: string
    outputs:
      result:
        value: ${{ jobs.check.outputs.result }}
      evidence:
        value: ${{ jobs.check.outputs.evidence }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.evidence.outputs.result }}
      evidence: ${{ steps.evidence.outputs.evidence }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.source-repository }}
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - name: Run mock dependency review
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if grep --fixed-strings "mock-vulnerable" pom.xml; then
            echo "Mock vulnerable dependency detected"
            exit 1
          fi

      - name: Record evidence
        id: evidence
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          result=fail
          [[ "$OUTCOME" == "success" ]] && result=pass
          evidence=$(jq -cn \
            --arg control dependency-review \
            --arg result "$result" \
            --arg sourceRepository "${SOURCE_REPOSITORY,,}" \
            --arg commitSha "${SOURCE_SHA,,}" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runUrl "$SERVER_URL/$SOURCE_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" \
            '{schemaVersion:"1.0.0",control:$control,result:$result,mock:true,sourceRepository:$sourceRepository,commitSha:$commitSha,observedAt:$observedAt,runUrl:$runUrl}')
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
          printf 'evidence=%s\n' "$evidence" >> "$GITHUB_OUTPUT"

      - name: Enforce mock result
        if: ${{ steps.evidence.outputs.result != 'pass' }}
        run: exit 1
