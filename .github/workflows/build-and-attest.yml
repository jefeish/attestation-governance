name: Build and attest

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: main
  workflow_run:
    workflows:
      - Mock SonarQube
      - Mock CodeQL
      - Mock Test
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  check-gate:
    name: Check all required workflows
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.gate.outputs.target_sha }}
    steps:
      - name: Check the exact commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            target_sha="$WORKFLOW_SHA"
          else
            target_sha="$(gh api "repos/$REPOSITORY/commits/$REQUESTED_REF" --jq '.sha')"
          fi

          echo "Checking workflows for commit $target_sha"
          workflow_files=("mock-sonarqube.yml" "mock-codeql.yml" "mock-test.yml")

          attempt=1
          while [ "$attempt" -le 30 ]; do
            all_done=true
            for workflow_file in "${workflow_files[@]}"; do
              result="$(gh run list \
                --repo "$REPOSITORY" \
                --workflow "$workflow_file" \
                --commit "$target_sha" \
                --limit 1 \
                --json status,conclusion \
                --jq 'if length == 0 then "missing" else .[0].status + ":" + (.[0].conclusion // "") end')"

              echo "$workflow_file -> $result"
              case "$result" in
                completed:success) ;;
                completed:*) echo "Required workflow failed: $workflow_file"; exit 1 ;;
                *) all_done=false ;;
              esac
            done

            if [ "$all_done" = true ]; then
              echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
            attempt=$((attempt + 1))
          done

          echo "Timed out waiting for all required workflows"
          exit 1

  build:
    name: Build JAR
    needs: check-gate
    runs-on: ubuntu-latest
    steps:
      - name: Get the checked code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-gate.outputs.target_sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the JAR
        run: |
          mkdir -p build/classes
          javac -d build/classes src/main/java/HelloWorld.java
          jar --create --file build/hello-world.jar \
            --main-class HelloWorld \
            -C build/classes .

      - name: Test the JAR
        run: java -jar build/hello-world.jar

      - name: Save the JAR for attestation
        uses: actions/upload-artifact@v4
        with:
          name: hello-world
          path: build/hello-world.jar

  attest:
    name: Attest checked JAR
    needs:
      - check-gate
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Get the JAR
        uses: actions/download-artifact@v4
        with:
          name: hello-world
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Record the successful checks
        run: |
          cat > build/check-results.json <<'EOF'
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ needs.check-gate.outputs.target_sha }}",
            "checks": {
              "mock-sonarqube": "success",
              "mock-codeql": "success",
              "mock-test": "success"
            }
          }
          EOF

      - name: Make build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: build/hello-world.jar

      - name: Make checks attestation
        uses: actions/attest@v4
        with:
          subject-path: build/hello-world.jar
          predicate-type: https://example.com/attestation/check-results/v1
          predicate-path: build/check-results.json
