name: Build and attest

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  check-gate:
    name: Check all required workflows
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.gate.outputs.target_sha }}
    steps:
      - name: Verify durable check attestations
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            target_sha="$MERGE_SHA"
          else
            target_sha="$(gh api "repos/$REPOSITORY/commits/$REQUESTED_REF" --jq '.sha')"
          fi

          echo "Checking attestations for commit $target_sha"
          check_names=("mock-sonarqube" "mock-codeql" "mock-test")

          attempt=1
          while [ "$attempt" -le 30 ]; do
            all_done=true
            for check_name in "${check_names[@]}"; do
              evidence_file="check-evidence/$check_name.json"
              mkdir -p check-evidence
              cat > "$evidence_file" <<EOF
          {
            "repository": "$REPOSITORY",
            "commit": "$target_sha",
            "check": "$check_name",
            "result": "success"
          }
          EOF

              if gh attestation verify "$evidence_file" \
                --repo "$REPOSITORY" \
                --predicate-type https://example.com/attestation/check-results/v1 \
                --signer-workflow "$REPOSITORY/.github/workflows/$check_name.yml" \
                --source-digest "$target_sha" >/dev/null 2>&1; then
                echo "$check_name -> verified"
              else
                echo "$check_name -> missing or invalid"
                all_done=false
              fi
            done

            if [ "$all_done" = true ]; then
              echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
            attempt=$((attempt + 1))
          done

          echo "Timed out waiting for all required workflows"
          exit 1

  build:
    name: Build JAR
    needs: check-gate
    runs-on: ubuntu-latest
    steps:
      - name: Get the checked code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-gate.outputs.target_sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the JAR
        run: |
          mkdir -p build/classes
          javac -d build/classes src/main/java/HelloWorld.java
          jar --create --file build/hello-world.jar \
            --main-class HelloWorld \
            -C build/classes .

      - name: Test the JAR
        run: java -jar build/hello-world.jar

      - name: Save the JAR for attestation
        uses: actions/upload-artifact@v4
        with:
          name: hello-world
          path: build/hello-world.jar

  attest:
    name: Attest checked JAR
    needs:
      - check-gate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Get the JAR
        uses: actions/download-artifact@v4
        with:
          name: hello-world
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Make build provenance attestation
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: build/hello-world.jar

      - name: Write the compliance record
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ needs.check-gate.outputs.target_sha }}
        run: |
          cat > compliance.json <<EOF
          {
            "repository": "$REPOSITORY",
            "commit": "$TARGET_SHA",
            "checks": [
              { "name": "mock-sonarqube", "result": "success" },
              { "name": "mock-codeql", "result": "success" },
              { "name": "mock-test", "result": "success" }
            ]
          }
          EOF
          cat compliance.json

      - name: Attach the compliance record to the JAR
        id: compliance
        uses: actions/attest@v4
        with:
          subject-path: build/hello-world.jar
          predicate-type: https://example.com/attestation/compliance/v1
          predicate-path: compliance.json

      - name: Collect the release files
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          COMPLIANCE_BUNDLE: ${{ steps.compliance.outputs.bundle-path }}
        run: |
          mkdir -p release
          cp build/hello-world.jar release/
          cp "$PROVENANCE_BUNDLE" release/hello-world.jar.provenance.sigstore.json
          cp "$COMPLIANCE_BUNDLE" release/hello-world.jar.compliance.sigstore.json
          ( cd release && sha256sum hello-world.jar > hello-world.jar.sha256 )
          ls -l release

      - name: Write the release notes
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ needs.check-gate.outputs.target_sha }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          COMPLIANCE_URL: ${{ steps.compliance.outputs.attestation-url }}
        run: |
          digest="$(cut -d' ' -f1 release/hello-world.jar.sha256)"
          {
            echo "Built from commit \`$TARGET_SHA\` after every required check passed."
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| JAR SHA-256 | \`$digest\` |"
            echo "| Build provenance | $PROVENANCE_URL |"
            echo "| Compliance record | $COMPLIANCE_URL |"
            echo
            echo "Verify online:"
            echo
            echo '```bash'
            echo "gh attestation verify hello-world.jar -R $REPOSITORY"
            echo '```'
            echo
            echo "Verify offline with the attached bundle:"
            echo
            echo '```bash'
            echo "gh attestation verify hello-world.jar -R $REPOSITORY \\"
            echo "  --bundle hello-world.jar.provenance.sigstore.json"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ needs.check-gate.outputs.target_sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "build-$RUN_NUMBER" release/* \
            --repo "$GH_REPO" \
            --target "$TARGET_SHA" \
            --title "Attested build $RUN_NUMBER" \
            --notes-file release-notes.md
